<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>High Insurance Risk Calculator</title>
  <link rel="stylesheet" href="client.css">
  <link rel="icon" type="image/x-icon" href="">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #ef0c0c;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #fefbfb;
      color: white;
      padding: 20px 0;
      font-size:1.6rem;
      letter-spacing: 1px;
    }
    main {
      padding: 20px;
    }
    form {
      display: inline-block;
      background: #f8f7f7;
      padding: 25px 35px;
      border-radius: 10px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
      text-align: left;
      margin-top: 20px;
    }
    .team-photo {
      width: 80%;
      max-width: 600px;
      margin: 20px auto;
      display: block;
      border: 3px solid #ccc;
    }
    ul {
      list-style-type: none;
      padding: 0;
    }
    li {
      margin: 10px 0;
    }
    a {
      color: #0077cc;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    section {
      margin-top: 40px;
    }
  </style>
</head>

<!--Main Content-->
<body>
  <header>
    <h1>Health Insurance Risk Calculator</h1>
  </header>
  <main>
    <h2>Blood Pressure</h2>
    <br>
    <img src="">
    <form action="#" id="form">
      <!--Systolic-->
      <label for="blood-pressure-1">Systolic</label>
      <select id="systolic"></select>
      <br>
      <br>
      <!--Diastolic-->
      <label for="blood-pressure-2">Diastolic</label>
      <select id="diastolic"></select>
      <br>
      <br>
      <!--Weight-->
      <label for="bmi-1">Weight (lbs)</label>
      <select id="weight"></select>
      <br>
      <br>
      <!--Height-->
      <label for="bmi-2">Height (Feet)</label>
      <select id="feet"></select>
      <br>
      <br>
      <label for="bmi-3">Height (Inches)</label>
      <select id="inches"></select>
      <br>
      <br>
      <!--Age-->
      <label>Age</label>
      <select id="age"></select>
      <br>
      <br>
      <!--Family Disease-->
      <label>Family Disease</label>
      <select id="disease"></select>
      <br>
      <br>
      <button type="submit" form="form" onclick="sendRiskCat()">Calculate Risk</button>
    </form>
    <p class="result"></p>
  </main>
  <script src="client.js"></script>
</body>
</html>
